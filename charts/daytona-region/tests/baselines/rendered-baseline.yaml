    app.kubernetes.io/component: proxy
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    # Proxy subdomain (exact match, e.g., proxy.daytona.example.com)
    - host: "proxy.daytona.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: release-name-daytona-region-proxy
                port:
                  number: 4000
    # Wildcard host for all subdomains - routes to proxy service
    # This handles sandbox subdomains like: 3000-sandbox-id.proxy.daytona.example.com
    - host: "*.proxy.daytona.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: release-name-daytona-region-proxy
                port:
                  number: 4000
  tls:
    # cert covers the apex proxy host (+ wildcard when wildcardTls=true)
    - hosts:
        - "proxy.daytona.example.com"
      secretName: proxy.daytona.example.com-tls
