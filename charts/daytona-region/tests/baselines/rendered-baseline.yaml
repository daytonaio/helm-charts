apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: release-name-daytona-region-runnermanager
  labels:
    helm.sh/chart: daytona-region-0.2.4
    app.kubernetes.io/name: daytona-region
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v0.207.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: runnermanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: daytona-region
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: runnermanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona-region
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: runnermanager
    spec:
      serviceAccountName: release-name-daytona-region-runnermanager
      securityContext:
        fsGroup: 2000
      containers:
        - name: runnermanager
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
          image: "docker.io/daytonaio/daytona-runner-manager:v0.207.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3010
              protocol: TCP
          env:
            - name: API_PORT
              value: "3010"
            # Floor of ready runners the manager maintains. Default 2 so a region
            # NEVER runs on a single runner: when one is rolled/lost, a peer is
            # already up for sandboxes to migrate onto. Pairs with the >=2 sandbox
            # node pool (otherwise the extra runner pod has nowhere to schedule).
            - name: MIN_RUNNERS
              value: "2"
            # Daytona org API key (Bearer) — same value as daytonaApiKey / registration hook secret
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-name-daytona-region-daytona-api-key
                  key: daytona-api-key
            # Required by the runner-manager's config validation — without it the
            # manager exits at boot. Same secret as API_TOKEN.
            - name: SYSTEM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-name-daytona-region-daytona-api-key
                  key: daytona-api-key
            - name: PROVIDER_TYPE
              value: "kubernetes"
            - name: PROVIDER_NAMESPACE
              value: "default"
            - name: LOG_LEVEL
              value: "info"
            - name: POD_WAIT_TIMEOUT
              value: "600"
            - name: SERVER_URL
              value: "https://api.daytona.example.com/api"
            - name: REGION_ID
              valueFrom:
                secretKeyRef:
                  name: release-name-daytona-region-region-config
                  key: id
            - name: ENVIRONMENT
              value: "production"
            - name: RUNNER_API_PORT
              value: "3000"
            - name: PLACEHOLDER_POD_IMAGE
