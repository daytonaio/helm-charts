# Source: daytona-region/templates/region-registration-hook.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: release-name-daytona-region-region-registration
  namespace: default
  labels:
    helm.sh/chart: daytona-region-0.2.4
    app.kubernetes.io/name: daytona-region
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v0.207.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: region-registration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona-region
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: region-registration
    spec:
      serviceAccountName: release-name-daytona-region-region-registration
      restartPolicy: OnFailure
      containers:
        - name: register
          image: daytonaio/kubectl:1.34.2-r2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e

              SECRET_NAME="release-name-daytona-region-region-config"
              NAMESPACE="default"

              # Function to create/update secret from JSON response
              create_secret() {
                local response="$1"
                echo "Creating/updating secret..."

                SECRET_DATA=$(echo "$response" | jq -r 'to_entries | .[] | "  \(.key): \(.value | tostring | @base64)"')

                cat > /tmp/secret.yaml <<SECRETEOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: release-name-daytona-region-region-config
                namespace: default
                labels:
                  helm.sh/chart: daytona-region-0.2.4
                  app.kubernetes.io/name: daytona-region
                  app.kubernetes.io/instance: release-name
                  app.kubernetes.io/version: "v0.207.0"
                  app.kubernetes.io/managed-by: Helm
                  app.kubernetes.io/component: region-config
              type: Opaque
              data:
              ${SECRET_DATA}
              SECRETEOF

                echo "Secret manifest:"
                cat /tmp/secret.yaml
                kubectl apply -f /tmp/secret.yaml
              }

              # Check if region config secret already exists
              if kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1; then
                echo "Region config secret '${SECRET_NAME}' exists."

                # Check if snapshot manager credentials are needed but missing
                if [ -n "${SNAPSHOT_MANAGER_URL}" ]; then
                  HAS_SM_CREDS=$(kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.snapshotManagerUsername}' 2>/dev/null || echo "")

                  if [ -z "${HAS_SM_CREDS}" ]; then
                    echo "Snapshot manager URL configured but credentials missing. Regenerating..."

                    # Get region ID from existing secret
                    REGION_ID=$(kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.id}' | base64 -d)

                    if [ -z "${REGION_ID}" ]; then
                      echo "Error: Could not get region ID from secret"
                      exit 1
                    fi

                    echo "Calling API to regenerate snapshot manager credentials for region ${REGION_ID}..."

                    SM_RESPONSE=$(curl -sf \
                      -X POST \
                      -H "Content-Type: application/json" \
                      -H "Authorization: Bearer ${DAYTONA_API_KEY}" \
                      "${DAYTONA_API_URL}/regions/${REGION_ID}/regenerate-snapshot-manager-credentials")

                    if [ -z "$SM_RESPONSE" ]; then
                      echo "Error: Empty response from regenerate credentials API"
                      exit 1
                    fi

                    echo "Credentials response received: $SM_RESPONSE"

                    # Get existing secret data and merge with new credentials
                    EXISTING_DATA=$(kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o json | jq '.data | to_entries | map({(.key): (.value | @base64d)}) | add')

                    # Merge existing data with new snapshot manager credentials
                    MERGED_RESPONSE=$(echo "$EXISTING_DATA" | jq --argjson sm "$SM_RESPONSE" '. + {snapshotManagerUsername: $sm.username, snapshotManagerPassword: $sm.password}')

                    create_secret "$MERGED_RESPONSE"
                    echo "Snapshot manager credentials added to secret!"
                    exit 0
                  fi
                fi

                echo "Region already fully registered. Skipping."
                exit 0
              fi

              echo "Registering region with Daytona API..."

              # Build the request payload
              if [ -n "${SNAPSHOT_MANAGER_URL}" ]; then
                PAYLOAD=$(jq -n \
                  --arg name "${REGION_NAME}" \
                  --arg proxyUrl "${PROXY_URL}" \
                  --arg snapshotManagerUrl "${SNAPSHOT_MANAGER_URL}" \
                  '{name: $name, proxyUrl: $proxyUrl, snapshotManagerUrl: $snapshotManagerUrl}')
              else
                PAYLOAD=$(jq -n \
                  --arg name "${REGION_NAME}" \
                  --arg proxyUrl "${PROXY_URL}" \
                  '{name: $name, proxyUrl: $proxyUrl}')
              fi

              echo "Calling API at ${DAYTONA_API_URL}/regions..."

              # Capture HTTP status AND body. `curl -sf` (used previously) hides
              # both, so a rejected registration surfaces only as "Job Failed"
              # with no reason — impossible to diagnose from the pre-install hook.
              HTTP_CODE=$(curl -s -o /tmp/register-resp.json -w '%{http_code}' \
                -X POST \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${DAYTONA_API_KEY}" \
                -d "${PAYLOAD}" \
                "${DAYTONA_API_URL}/regions" || echo "000")
              : "${HTTP_CODE:=000}"
              RESPONSE=$(cat /tmp/register-resp.json 2>/dev/null || echo "")
              echo "Register API returned HTTP ${HTTP_CODE}"

              # Region name already taken in Daytona Cloud (a prior run, or a
              # deleted local config secret). A fresh install can't recover its
              # keys, so fail with an actionable message instead of silently.
              if [ "${HTTP_CODE}" = "409" ] || printf '%s' "${RESPONSE}" | grep -qi 'already exists'; then
                echo "ERROR: region '${REGION_NAME}' already exists in Daytona Cloud (HTTP ${HTTP_CODE})."
                echo "Response body: ${RESPONSE}"
                echo "This fresh install has no saved config for it. Either:"
                echo "  - set a UNIQUE regionName and re-install, OR"
                echo "  - delete the stale region, then re-install:"
                echo "      curl -H 'Authorization: Bearer <key>' ${DAYTONA_API_URL}/regions    # find id by name"
                echo "      curl -X DELETE -H 'Authorization: Bearer <key>' ${DAYTONA_API_URL}/regions/<id>"
                exit 1
              fi

              case "${HTTP_CODE}" in
                2??) : ;;  # success
                *)
                  echo "ERROR: region registration failed (HTTP ${HTTP_CODE})."
                  echo "Response body: ${RESPONSE}"
                  echo "Hint: 401/403 => bad/expired daytonaApiKey; 400 => payload rejected"
                  echo "      (proxyUrl='${PROXY_URL}', name='${REGION_NAME}'); 000 => could not reach API."
                  exit 1
                  ;;
              esac

              if [ -z "${RESPONSE}" ]; then
                echo "Error: Empty response body despite HTTP ${HTTP_CODE}"
                exit 1
              fi

              echo "API response received: ${RESPONSE}"
              create_secret "${RESPONSE}"
              echo "Region registration complete!"
          env:
            - name: DAYTONA_API_URL
              value: "https://api.daytona.example.com/api"
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: release-name-daytona-region-daytona-api-key
                  key: daytona-api-key
            - name: PROXY_URL
              value: "https://proxy.daytona.example.com"
            - name: REGION_NAME
              value: "test-region"
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi

