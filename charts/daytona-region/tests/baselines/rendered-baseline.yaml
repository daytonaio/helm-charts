# Source: daytona-region/templates/proxy-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: release-name-daytona-region-proxy
  labels:
    helm.sh/chart: daytona-region-0.2.4
    app.kubernetes.io/name: daytona-region
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v0.207.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daytona-region
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona-region
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: release-name-daytona-region-proxy
      securityContext:
        fsGroup: 2000
      containers:
        - name: proxy
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
          image: "docker.io/daytonaio/daytona-proxy:v0.207.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: release-name-daytona-region-region-config
          env:
            - name: REDIS_HOST
              value: ""
            # Proxy Configuration
            - name: PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: release-name-daytona-region-region-config
                  key: proxyApiKey
            - name: PROXY_PORT
              value: "4000"
            - name: PROXY_PROTOCOL
              value: "https"
            - name: PROXY_DOMAIN
              value: "proxy.daytona.example.com"
            - name: DAYTONA_API_URL
              value: "https://api.daytona.example.com/api"
            - name: COOKIE_DOMAIN
              value: "daytona.example.com"
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi

