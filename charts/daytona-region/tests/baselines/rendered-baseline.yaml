# Source: daytona-region/templates/runner-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: release-name-daytona-region-runner
  namespace: default
  labels:
    helm.sh/chart: daytona-region-0.2.4
    app.kubernetes.io/name: daytona-region
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v0.207.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: runner
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: daytona-region
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: runner
      daytona.io/runner: "true"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona-region
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: runner
        daytona.io/runner: "true"
    spec:
      nodeSelector:
        daytona-sandbox-c: "true"
      tolerations:
        - key: "sandbox"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: release-name-daytona-region-runner
      terminationGracePeriodSeconds: 30
      containers:
        # Docker installer sidecar - installs Docker on the host node
        - name: docker-installer
          image: ubuntu:24.04
          securityContext:
            privileged: true
          envFrom:
            - configMapRef:
                name: release-name-daytona-region-runner-docker-installer-config
          volumeMounts:
            - name: host-root
              mountPath: /host
              mountPropagation: Bidirectional
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting Docker and Sysbox installation on host node..."
              echo "XFS Storage Size: ${XFS_STORAGE_SIZE}"
              echo "Airgapped Mode: ${AIRGAPPED_MODE}"
              
              # Shared add_host_alias() function — used by BOTH the static hostAliases loop
              # below and the dynamicHostAliases loop. The awk-based tmp-merge writes the
              # entry into a temp file and atomically renames it onto /etc/hosts via nsenter,
              # so the host file is never half-written. Idempotent: re-running with the same
              # (ip,name) pair leaves /etc/hosts in a deduplicated state — existing entries
              # for that hostname are overwritten in place, new entries are appended exactly
              # once.
              echo "Setting up host aliases..."
              add_host_alias() {
                ip="$1"; name="$2"
                if [ -z "$ip" ] || [ -z "$name" ]; then
                  echo "[host-alias] WARN: skipping empty ip='$ip' name='$name'" >&2
                  return 0
                fi
                nsenter -t 1 -m -u -n -i sh -c "
                  awk -v ip=\"$ip\" -v name=\"$name\" '
                    BEGIN { found=0 }
                    {
                      if (\$2 == name) { print ip\" \"name; found=1 }
                      else { print }
                    }
                    END { if (!found) print ip\" \"name }
                  ' /etc/hosts > /etc/hosts.tmp && mv /etc/hosts.tmp /etc/hosts
                "
                echo "[host-alias] set $ip $name"
              }
              # Static aliases (explicit ip + hostnames in services.runner.hostAliases)
              # `squote` shell-quotes the helm-substituted values so a hostname containing
              # special characters (e.g. quotes or backslashes) cannot break the surrounding
              # shell context. add_host_alias receives the unquoted contents via positional
              # arguments and re-quotes them safely with awk -v.
              # Dynamic aliases resolved at install time via Kubernetes DNS (services.runner.dockerInstaller.dynamicHostAliases)
              # Surface the resulting host entries we care about
              nsenter -t 1 -m -u -n -i sh -c 'grep -E "registry|minio|snapshot-manager" /etc/hosts || true'
              
              # Enter the host namespace and install Docker + Sysbox
              nsenter -t 1 -m -u -n -i sh <<'EOF'
              
              # Set XFS storage size in host namespace (value injected at pod creation)
              export XFS_STORAGE_SIZE="50G"
              export AIRGAPPED_MODE="false"
              
              # Offline packages location (used in airgapped mode)
              PACKAGES_DIR="/tmp/offline-packages"
              # Function to install Docker and XFS tools (online mode)
              install_docker() {
                if command -v docker >/dev/null 2>&1 && [ -x /usr/bin/dockerd ]; then
                  echo "Docker is already installed"
                  docker version
                  
                  # Still check/install XFS tools even if Docker exists
                  if ! command -v xfs_quota >/dev/null 2>&1; then
                    echo "Installing XFS tools..."
                    if command -v apt-get >/dev/null 2>&1; then
                      apt-get update
                      apt-get install -y xfsprogs
                    elif command -v yum >/dev/null 2>&1; then
                      yum install -y xfsprogs
                    fi
                  fi
                  return 0
                fi
                
                echo "Installing Docker and XFS tools..."
                
                if command -v apt-get >/dev/null 2>&1; then
                  # Debian/Ubuntu based - download Docker CE packages directly
                  cd /tmp
                  
                  # For Ubuntu 24.04 (noble)
                  DOCKER_VERSION="27.4.1-1~ubuntu.24.04~noble"

                  apt-get update
                  apt-get install -y wget xfsprogs
                  
                  wget https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64/docker-ce_${DOCKER_VERSION}_amd64.deb
                  wget https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64/docker-ce-cli_${DOCKER_VERSION}_amd64.deb
                  #wget https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64/docker-buildx-plugin_0.19.3-1~ubuntu.24.04~noble_amd64.deb
                  # Install with --force-depends to skip the containerd.io dependency
                  dpkg --force-depends -i docker-ce-cli_${DOCKER_VERSION}_amd64.deb
                  dpkg --force-depends -i docker-ce_${DOCKER_VERSION}_amd64.deb

                  # AKS compatibility: AKS nodes ship moby-containerd which has a hard
                  # apt-package conflict with docker-ce, so dpkg refuses to install the
                  # daemon (CLI installs fine, daemon does not). If dockerd is missing
                  # after the deb install, fall back to the static-binary tarball.
                  # EKS/GKE/vanilla Ubuntu nodes install dockerd via the deb above and
                  # skip this block entirely.
                  if [ ! -x /usr/bin/dockerd ]; then
                    echo "dockerd not installed by deb (managed-runtime conflict?) - using static tarball"
                    curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.4.1.tgz -o /tmp/docker.tgz
                    tar xzf /tmp/docker.tgz -C /tmp
                    install -m 0755 /tmp/docker/dockerd /usr/bin/dockerd
                    install -m 0755 /tmp/docker/docker-proxy /usr/bin/docker-proxy
                    install -m 0755 /tmp/docker/docker-init /usr/bin/docker-init
                    getent group docker >/dev/null 2>&1 || groupadd docker
                    printf '%s\n' '[Unit]' 'Description=Docker Application Container Engine' 'After=network-online.target' 'Wants=network-online.target' '' '[Service]' 'Type=notify' 'ExecStart=/usr/bin/dockerd' 'ExecReload=/bin/kill -s HUP $MAINPID' 'Restart=always' 'RestartSec=2' 'LimitNOFILE=infinity' 'LimitNPROC=infinity' 'LimitCORE=infinity' 'Delegate=yes' 'KillMode=process' '' '[Install]' 'WantedBy=multi-user.target' > /etc/systemd/system/docker.service
                  fi

                  mkdir -p /etc/docker
                  systemctl daemon-reload
                  systemctl enable docker
                elif command -v yum >/dev/null 2>&1; then
                  # RHEL/CentOS based
                  yum install -y docker curl xfsprogs
                  systemctl enable docker
                fi
                
                echo "Docker and XFS tools installation completed"
                return 0
              }
              
              # Function to install Sysbox (online mode)
              install_sysbox() {
                # Pinned upstream release, verified by the sha256 published with it.
                # Bumping these three lines is the whole version change.
                SYSBOX_VERSION="v0.7.1"
                SYSBOX_DEB="sysbox-ce_0.7.1.linux_amd64.deb"
                SYSBOX_SHA256="9d6d5484f980d0a17f86c492c1262015c2afb66280bdb97215b79fde6a0261c5"

                if command -v sysbox >/dev/null 2>&1 || [ -f /usr/bin/sysbox-runc ]; then
                  # Nodes keep the Sysbox they were provisioned with. Upgrading in place
                  # means stopping dockerd, which kills every sandbox on the node; the pin
                  # is picked up by replacing nodes, not by re-running this.
                  echo "Sysbox is already installed (chart pins ${SYSBOX_VERSION}); leaving it alone"
                  /usr/bin/sysbox-runc --version 2>/dev/null || true
                  return 0
                fi

                echo "Installing Sysbox ${SYSBOX_VERSION} from GitHub releases..."

                if command -v apt-get >/dev/null 2>&1; then
                  # Debian/Ubuntu based - install from GitHub
                  . /etc/os-release

                  # This chart installs the amd64 package only.
                  ARCH=$(uname -m)
                  if [ "$ARCH" != "x86_64" ] && [ "$ARCH" != "amd64" ]; then
                    echo "ERROR: this chart installs the amd64 Sysbox package only; node is ${ARCH}"
                    return 1
                  fi

                  cd /tmp || return 1
                  rm -f "$SYSBOX_DEB" /tmp/sysbox.sha256

                  # Download over TLS. There is deliberately no unverified retry here:
                  # whatever lands in this file becomes the node's container runtime.
                  echo "Downloading ${SYSBOX_DEB}..."
                  if ! curl -fsSLO "https://github.com/nestybox/sysbox/releases/download/${SYSBOX_VERSION}/${SYSBOX_DEB}"; then
                    echo "ERROR: failed to download ${SYSBOX_DEB}"
                    return 1
                  fi

                  echo "${SYSBOX_SHA256}  ${SYSBOX_DEB}" > /tmp/sysbox.sha256
                  if ! sha256sum -c /tmp/sysbox.sha256; then
                    echo "ERROR: ${SYSBOX_DEB} failed sha256 verification; refusing to install"
                    rm -f "$SYSBOX_DEB" /tmp/sysbox.sha256
                    return 1
                  fi
                  rm -f /tmp/sysbox.sha256

                  # Stop Docker before installing Sysbox
                  echo "Stopping Docker for Sysbox installation..."
                  systemctl stop docker 2>/dev/null || true

                  # Install dependencies
                  apt-get update
                  apt-get install -y jq fuse rsync rclone

                  # Install Sysbox
                  echo "Installing Sysbox package..."
                  if ! dpkg -i "$SYSBOX_DEB"; then
                    echo "Resolving Sysbox dependencies..."
                    apt-get install -f -y
                    if ! dpkg -i "$SYSBOX_DEB"; then
                      echo "ERROR: dpkg -i ${SYSBOX_DEB} failed"
                      rm -f "$SYSBOX_DEB"
                      return 1
                    fi
                  fi

                  # Cleanup
                  rm -f "$SYSBOX_DEB"

                else
                  # Upstream publishes .deb only. The RPM tarball this chart used to fetch
                  # has never existed as a release asset, so the yum path could only ever
                  # 404 and then leave dockerd pointed at a runtime that was not installed.
                  echo "ERROR: Sysbox upstream publishes .deb packages only; this node has no apt-get."
                  echo "       Sandbox nodes must run Ubuntu 24.04 (noble) -- the same requirement the"
                  echo "       Docker install below has. Either use an Ubuntu 24.04 node image, or"
                  echo "       pre-install Sysbox and set services.runner.dockerInstaller.enabled=false."
                  return 1
                fi

                if ! /usr/bin/sysbox-runc --version >/dev/null 2>&1; then
                  echo "ERROR: sysbox-runc is not runnable after install"
                  return 1
                fi

                echo "Sysbox ${SYSBOX_VERSION} installation completed"
                return 0
              }
              
              # Function to setup XFS for Docker storage with quota support
              setup_xfs_storage() {
                echo "Setting up XFS filesystem for Docker storage..."
                
                # Check current filesystem of /var/lib/docker
                DOCKER_DIR="/var/lib/docker"
                
                # Check if already on XFS
                if [ -d "$DOCKER_DIR" ]; then
                  FS_TYPE=$(df -T "$DOCKER_DIR" | tail -1 | awk '{print $2}')
                  echo "Current filesystem for $DOCKER_DIR: $FS_TYPE"
                  
                  if [ "$FS_TYPE" = "xfs" ]; then
                    echo "✓ Already on XFS filesystem"
                    
                    # Check if quota is enabled
                    if xfs_quota -x -c 'state' "$DOCKER_DIR" 2>/dev/null | grep -q "Project quota state on"; then
                      echo "✓ XFS quotas already enabled"
                      return 0
                    else
                      echo "⚠ XFS quotas not enabled, attempting to remount..."
                      # Try to remount with quota options
                      MOUNT_POINT=$(df "$DOCKER_DIR" | tail -1 | awk '{print $6}')
                      mount -o remount,prjquota "$MOUNT_POINT" 2>/dev/null || echo "Could not enable quotas on existing mount"
                    fi
                    return 0
                  fi
                  
                  echo "⚠ $DOCKER_DIR is on $FS_TYPE, not XFS"
                  echo "Will attempt to migrate to XFS loopback..."
                fi

                # SAFETY GUARD: never migrate a populated Docker root. If
                # /var/lib/docker already holds containers (a previous run, i.e.
                # live sandboxes on this node), moving it aside makes dockerd come
                # up empty — every running sandbox then returns 404 "No such
                # container" while its API row stays state=started, which a
                # DaemonSet roll cannot self-heal. Migration is only safe on a
                # pristine node; this stops a destructive re-migration on every
                # subsequent roll if the XFS mount ever fails to stick.
                if [ -d "$DOCKER_DIR/containers" ] && [ -n "$(ls -A "$DOCKER_DIR/containers" 2>/dev/null)" ]; then
                  echo "⚠ $DOCKER_DIR already contains Docker containers — refusing XFS migration to avoid orphaning running sandboxes; keeping existing storage (no per-sandbox quota until the node is drained and re-provisioned)."
                  return 0
                fi

                # Stop Docker before migration
                systemctl stop docker 2>/dev/null || true
                
                # Backup existing Docker data if it exists
                if [ -d "$DOCKER_DIR" ] && [ "$(ls -A $DOCKER_DIR)" ]; then
                  echo "Backing up existing Docker data..."
                  mv "$DOCKER_DIR" "${DOCKER_DIR}.backup.$(date +%s)"
                fi
                
                # Create XFS loopback file for Docker storage
                XFS_FILE="/var/lib/docker-xfs.img"
                XFS_SIZE="${XFS_STORAGE_SIZE:-50G}"  # Default 50GB, can be configured
                
                if [ ! -f "$XFS_FILE" ]; then
                  echo "Creating XFS storage file ($XFS_SIZE)..."
                  # Create sparse file
                  truncate -s "$XFS_SIZE" "$XFS_FILE"
                  
                  # Format as XFS with project quota support
                  echo "Formatting XFS filesystem with quota support..."
                  mkfs.xfs -f -n ftype=1 "$XFS_FILE"
                fi
                
                # Create mount point
                mkdir -p "$DOCKER_DIR"
                
                # Mount XFS with project quota enabled
                echo "Mounting XFS filesystem..."
                mount -o loop,prjquota "$XFS_FILE" "$DOCKER_DIR"
                
                # Add to fstab for persistence (if not already there)
                if ! grep -q "$XFS_FILE" /etc/fstab; then
                  echo "$XFS_FILE $DOCKER_DIR xfs loop,prjquota 0 0" >> /etc/fstab
                fi
                
                # Initialize XFS quota
                echo "Initializing XFS quota system..."
                xfs_quota -x -c 'project -s -d 1' "$DOCKER_DIR" 2>/dev/null || true
                
                echo "✓ XFS storage setup completed"
                return 0
              }
              
              # Function to configure Docker to use Sysbox runtime
              configure_docker_sysbox() {
                echo "Configuring Docker to use Sysbox runtime..."
                
                mkdir -p /etc/docker
                
                # Create or update Docker daemon configuration
                if [ -f /etc/docker/daemon.json ]; then
                  # Backup existing config
                  cp /etc/docker/daemon.json /etc/docker/daemon.json.bak
                fi
                
                # Write Docker daemon config with Sysbox runtime
                # Note: Not including storage-driver to avoid conflicts with GKE systemd flags
                # icc=false does two things, neither of which is the whole control.
                # 1. It makes moby load br_netfilter and set bridge-nf-call-iptables=1
                #    (moby libnetwork/drivers/bridge/bridge_linux.go:849-851), which is the
                #    precondition the DOCKER-USER rule needs to see same-bridge traffic at all.
                # 2. It installs moby's own FORWARD drop before any pod schedules, which covers
                #    the boot window the DaemonSet cannot.
                # Both only happen on a daemon start with no running containers: moby skips
                # configureNetworking when live-restore hands it active sandboxes
                # (daemon/daemon_unix.go:848-850), so on an in-place upgrade this key is inert.
                # daytona-peer-denial.sh therefore asserts the same precondition itself and
                # carries the running population.
                # NOTE: changing this file makes the installer restart dockerd once per node.
                cat > /etc/docker/daemon.json << 'DOCKERCONFIG'
              {
                "runtimes": {
                  "sysbox-runc": {
                    "path": "/usr/bin/sysbox-runc"
                  }
                },
                "default-runtime": "sysbox-runc",
                "icc": false,
                "live-restore": true,
                "log-driver": "json-file",
                "log-opts": {
                  "max-size": "10m",
                  "max-file": "3"
                }
              }
              DOCKERCONFIG
                
                echo "Docker configuration updated"
                return 0
              }
              
              # Setup XFS filesystem for Docker storage with quotas
              setup_xfs_storage
              
              # Install Sysbox (before Docker, as Docker config depends on sysbox)
              #
              # FAIL CLOSED. configure_docker_sysbox is about to set sysbox-runc as the
              # daemon's default runtime. If the install did not succeed, dockerd would come
              # up pointed at a runtime that is not on the node. Distinct exit code so the
              # outer shell can tell this apart from the peer-denial failure (3).
              if ! install_sysbox; then
                echo "FATAL: Sysbox installation failed; refusing to configure Docker for a runtime that is not installed"
                exit 4
              fi

              # Install Docker
              install_docker
              
              # Configure Docker to use Sysbox
              configure_docker_sysbox
              # Single-source the peer-denial logic to a host script. The bootstrap heredoc and
              # the monitor loop run in separate shells and cannot share a function, and an
              # inline copy in each has already been observed to drift.
              cat > /usr/local/sbin/daytona-peer-denial.sh << 'PEERDENIAL'
              #!/bin/sh
              # Deny traffic between unrelated sandboxes on the host default bridge.
              #
              # Scope: exactly one topology -- sandboxes on docker0, which is what this
              # chart produces. It does not apply if sandboxes are moved to another bridge.
              #
              # Contract with linked sandboxes: both peers hold a docker0 endpoint AND a link
              # endpoint. DNS by name and by sandbox id resolves to the link address, so linked
              # traffic is unaffected. Traffic addressed to a peer's raw docker0 address IS
              # denied -- intentionally, since an interface matcher cannot tell it apart from
              # unrelated-tenant traffic.
              #
              # Invariant: nothing above this rule in DOCKER-USER may ACCEPT sandbox peer
              # traffic. The runner anchors its link ACCEPTs to -i <link-bridge> for exactly
              # this reason (apps/runner/pkg/netrules/link_icc.go); keep it that way.
              set -u
              rc=0
              changed=0

              # Kernel precondition. Same-bridge frames are switched at L2 and reach iptables
              # only when br_netfilter is loaded with bridge-nf-call-iptables=1. Docker
              # provisions this itself when icc=false, but only on a daemon start with no
              # running containers -- so on an in-place upgrade it is absent and the rule below
              # would install cleanly and filter nothing. Assert it here and read it back.
              modprobe br_netfilter 2>/dev/null || true
              echo 1 > /proc/sys/net/bridge/bridge-nf-call-iptables 2>/dev/null || true
              echo 1 > /proc/sys/net/bridge/bridge-nf-call-ip6tables 2>/dev/null || true
              echo br_netfilter > /etc/modules-load.d/daytona-sandbox-isolation.conf 2>/dev/null || true
              printf 'net.bridge.bridge-nf-call-iptables = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\n' \
                > /etc/sysctl.d/99-daytona-sandbox-isolation.conf 2>/dev/null || true
              # Scope note, deliberately not a runtime check. The rule is anchored to
              # docker0, so it matches nothing if sandboxes are placed on another bridge.
              # A presence test on docker0 would not detect that: Docker creates docker0
              # regardless of where containers are attached. Detecting it properly means
              # checking where sandboxes actually land, and the configuration that would
              # move them (CONTAINER_NETWORK) is not reachable through this chart at all --
              # the runner ConfigMap is a fixed key list that does not carry it, and
              # extraEnv renders only under mainContainer.enabled. The honest signal is the
              # DOCKER-USER packet counters logged below: a rule matching nothing stays at
              # zero. Revisit if CONTAINER_NETWORK ever becomes settable here.

              nf=$(cat /proc/sys/net/bridge/bridge-nf-call-iptables 2>/dev/null || echo missing)
              if [ "$nf" != "1" ]; then
                echo "ERROR: bridge-nf-call-iptables=$nf -- the peer-denial rule will NOT filter same-bridge traffic on this node"
                rc=1
              fi

              # Check-then-insert: a bare -I on a reconcile stacks a duplicate every pass.
              if ! iptables -w 5 -C DOCKER-USER -i docker0 -o docker0 -j DROP 2>/dev/null; then
                if iptables -w 5 -I DOCKER-USER 1 -i docker0 -o docker0 -j DROP; then
                  echo "Installed IPv4 sandbox peer-denial rule"
                  changed=1
                else
                  echo "ERROR: failed to install IPv4 sandbox peer-denial rule"
                  rc=1
                fi
              fi

              # ip6tables defaults on from Docker 27.4.1 (cmd/dockerd/config_unix.go:31), so this
              # chain exists on every node this chart provisions and a failure here is a real
              # gap, not an absent feature: containers can hold IPv6 addresses and sandbox
              # services bind ::. Counts toward the exit status.
              if ! ip6tables -w -C DOCKER-USER -i docker0 -o docker0 -j DROP 2>/dev/null; then
                if ip6tables -w -I DOCKER-USER 1 -i docker0 -o docker0 -j DROP; then
                  echo "Installed IPv6 sandbox peer-denial rule"
                  changed=1
                else
                  echo "ERROR: failed to install IPv6 sandbox peer-denial rule; IPv6 peer traffic is NOT denied"
                  rc=1
                fi
              fi

              # Log the chain when we changed something or could not enforce. Silent on a
              # steady-state reconcile, so the 60s loop does not spam the node log.
              if [ "$changed" = 1 ] || [ "$rc" != 0 ]; then
                echo "DOCKER-USER after assert:"
                iptables -w 5 -L DOCKER-USER -n -v 2>/dev/null | head -20 || true
                echo "bridge-nf-call-iptables=$nf"
              fi

              exit $rc
              PEERDENIAL
              sed -i 's/^              //' /usr/local/sbin/daytona-peer-denial.sh
              chmod 0755 /usr/local/sbin/daytona-peer-denial.sh

              # Start Sysbox services
              echo "Starting Sysbox services..."
              systemctl enable sysbox 2>/dev/null || true
              systemctl start sysbox 2>/dev/null || true
              
              # Start Docker. Only bounce the host daemon when the config actually
              # changed or docker isn't already running with the sysbox runtime. A
              # blind `restart` on a no-op DaemonSet roll bounces the host dockerd
              # and stops every running sandbox that predates live-restore taking
              # effect, so we avoid restarting unless it is truly necessary.
              echo "Ensuring Docker is running with the Sysbox runtime..."
              # Decide whether the daemon config changed in a way that warrants a restart.
              # The icc key is deliberately excluded from the comparison. It only takes effect
              # on a daemon start with no running containers, so bouncing dockerd to apply it
              # either does nothing (live-restore on: sandboxes survive, moby skips
              # configureNetworking) or stops every sandbox on the node to apply a key the
              # DOCKER-USER rule already covers. The key still lands in daemon.json and applies
              # at the next natural restart, which is a reboot or a fresh node -- both of which
              # start dockerd clean anyway.
              daemon_json_changed=0
              if [ -f /etc/docker/daemon.json.bak ]; then
                grep -v '"icc"' /etc/docker/daemon.json > /tmp/daytona-dj-new 2>/dev/null || true
                grep -v '"icc"' /etc/docker/daemon.json.bak > /tmp/daytona-dj-old 2>/dev/null || true
                cmp -s /tmp/daytona-dj-new /tmp/daytona-dj-old || daemon_json_changed=1
                rm -f /tmp/daytona-dj-new /tmp/daytona-dj-old
              fi
              need_restart=0
              if ! systemctl is-active --quiet docker; then
                need_restart=1
              elif ! docker info 2>/dev/null | grep -q 'sysbox-runc'; then
                need_restart=1
              elif [ "$daemon_json_changed" = 1 ]; then
                need_restart=1
              fi
              if [ "$need_restart" = 1 ]; then
                echo "Restarting Docker (first install, or daemon.json/runtime change)..."
                systemctl restart docker
              else
                echo "Docker already running with Sysbox runtime and unchanged config; skipping restart to avoid disrupting running sandboxes"
              fi
              # Assert peer denial now that dockerd is up and DOCKER-USER exists.
              #
              # FAIL CLOSED. If isolation is enabled and cannot be established, this container
              # exits non-zero rather than leaving the node running while values claim peers
              # are denied. The node becomes visibly broken instead of quietly unprotected.
              #
              # Limit worth knowing: in the runner-manager topology this DaemonSet only
              # bootstraps the node, so a crash here does not by itself stop sandboxes being
              # placed on it. Blocking admission requires the runner-side health probe.
              echo "Asserting sandbox peer-denial..."
              if ! /usr/local/sbin/daytona-peer-denial.sh; then
                echo "FATAL: sandbox peer-denial could not be established; refusing to report this node healthy"
                # Distinct code: the outer shell treats only this as fatal. The rest of this
                # bootstrap script was never written to be exit-status clean, so gating the
                # container on its overall status would crash nodes for unrelated reasons.
                exit 3
              fi

              # Verify installation
              echo "=== Verification ==="
              echo "Docker version:"
              docker version
              echo ""
              echo "Docker runtime:"
              docker info | grep -i runtime || echo "Runtime info not available"
              echo ""
              echo "Sysbox status:"
              systemctl status sysbox --no-pager -l || echo "Sysbox service status not available"
              
              EOF
              bootstrap_rc=$?
              # Propagate the Sysbox install failure out of nsenter. Without this the inner
              # exit is swallowed and the sidecar drops into its monitor loop on a node whose
              # Docker daemon is configured for a runtime that was never installed.
              if [ "$bootstrap_rc" = 4 ]; then
                echo "FATAL: host bootstrap could not install Sysbox; exiting"
                exit 1
              fi
              # Propagate the peer-denial failure out of nsenter. Without this the inner
              # exit is swallowed and the container proceeds as though the node were
              # protected.
              if [ "$bootstrap_rc" = 3 ]; then
                echo "FATAL: host bootstrap could not establish sandbox peer-denial; exiting"
                exit 1
              fi
              
              echo "Docker and Sysbox installer initialized. Monitoring services..."
              
              # Monitor and ensure Docker and Sysbox stay running
              while true; do
                nsenter -t 1 -m -u -n -i sh -c '
                  # Check Sysbox
                  if ! systemctl is-active --quiet sysbox 2>/dev/null; then
                    echo "Sysbox service is down, restarting..."
                    systemctl start sysbox 2>/dev/null || echo "Failed to start Sysbox"
                  fi
                  
                  # Check Docker. Each check reports its own failure: the payload exit
                  # status is fixed at 0 below, so no later command can mask an earlier one.
                  if ! systemctl is-active --quiet docker; then
                    echo "Docker service is down, restarting..."
                    systemctl start docker || echo "Failed to start Docker"
                  fi

                  # Re-assert sandbox peer denial. DOCKER-USER survives a dockerd restart, but
                  # re-check anyway: an operator iptables flush would otherwise silently reopen
                  # peer reachability until the next pod start.
                  #
                  # Fail closed: exit non-zero so the container restarts and re-runs the full
                  # bootstrap assert, rather than looping forever on an unprotected node.
                  if ! /usr/local/sbin/daytona-peer-denial.sh; then
                    echo "FATAL: sandbox peer-denial re-assert failed"
                    exit 1
                  fi

                  exit 0
                ' || { rc=$?
                  if [ "$rc" = 1 ]; then
                    echo "Sandbox peer-denial enforcement lost; exiting so the container restarts"
                    exit 1
                  fi
                  echo "Health check failed, will retry..."
                }
                sleep 60
              done
              ln -s /host/var/lib/docker /var/lib/docker
        # Daytona daemon binary installer sidecar.
        #
        # Why this exists:
        #   The daytona-runner binary embeds the per-sandbox binaries (daemon
        #   and computer-use) under static/*. At startup it extracts them into
        #   its own container FS at /usr/local/bin/.tmp/binaries/ and uses
        #   those paths as *bind-mount sources* when it creates sandbox Docker
        #   containers via the host docker socket. Because the Docker daemon
        #   runs on the host, it resolves those bind paths against the host
        #   filesystem - where they don't exist. Docker then silently creates
        #   the missing sources as empty directories, and the sandbox fails
        #   with 'exec: "/usr/local/bin/daytona": permission denied' (you
        #   can't exec a directory).
        #
        # What this sidecar does:
        #   Run daytona-runner just long enough to extract the embedded
        #   binaries into its own FS, then copy each one (+x) to the matching
        #   path on the host via the host-root bind-mount. Stale empty
        #   directories auto-created by Docker are cleaned up first.
        - name: daytona-binary-installer
          image: "docker.io/daytonaio/daytona-runner:v0.207.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          # Minimal env to satisfy daytona-runner config validation so it
          # reaches the point of extracting its embedded binaries. These
          # values are throwaway; the runner is killed as soon as the binaries
          # are on disk and never contacts any control plane.
          env:
            - name: DAYTONA_API_URL
              value: "http://127.0.0.1"
            - name: SERVER_URL
              value: "http://127.0.0.1"
            - name: API_TOKEN
              value: "installer"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ENDPOINT_URL
              value: "http://127.0.0.1"
            - name: AWS_ACCESS_KEY_ID
              value: "installer"
            - name: AWS_SECRET_ACCESS_KEY
              value: "installer"
            - name: AWS_DEFAULT_BUCKET
              value: "installer"
            - name: SSH_PUBLIC_KEY
              value: "installer"
            - name: HOST_SRC_DIR
              value: "/usr/local/bin/.tmp/binaries"
            - name: BINARIES
              value: "daemon-amd64 daytona-computer-use"
            - name: EXTRACT_TIMEOUT_SEC
              value: "60"
            - name: REFRESH_INTERVAL_SEC
              value: "300"
          volumeMounts:
            - name: host-root
              mountPath: /host
              mountPropagation: Bidirectional
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              SRC_DIR=/usr/local/bin/.tmp/binaries
              DST_DIR="/host${HOST_SRC_DIR}"

              echo "[daytona-binary-installer] binaries=[${BINARIES}] target=${HOST_SRC_DIR}/ on host"

              # Docker auto-creates missing bind-mount sources as empty dirs.
              # Those stale dirs block us from later writing the binary as a
              # file at the same path. Remove any we'd overwrite.
              cleanup_stale_dirs() {
                mkdir -p "${DST_DIR}"
                for name in ${BINARIES}; do
                  if [ -d "${DST_DIR}/${name}" ] && [ ! -L "${DST_DIR}/${name}" ]; then
                    echo "[daytona-binary-installer] removing stale directory ${HOST_SRC_DIR}/${name}/ on host"
                    rm -rf "${DST_DIR}/${name}"
                  fi
                done
              }

              install_one() {
                # Atomic install: write to .new then rename, so a sandbox start
                # mid-refresh never sees a half-written or non-executable file.
                name=$1
                install -m 0755 "${SRC_DIR}/${name}" "${DST_DIR}/${name}.new" \
                  && mv -f "${DST_DIR}/${name}.new" "${DST_DIR}/${name}"
              }

              install_all() {
                for name in ${BINARIES}; do
                  if [ ! -s "${SRC_DIR}/${name}" ]; then
                    echo "[daytona-binary-installer] WARN: source ${SRC_DIR}/${name} missing, skipping"
                    continue
                  fi
                  install_one "${name}"
                  echo "[daytona-binary-installer] installed ${HOST_SRC_DIR}/${name} ($(stat -c '%s bytes' "${DST_DIR}/${name}"))"
                done
              }

              extract_binaries() {
                cd /usr/local/bin
                # Clear any partially-extracted files so the size-check below
                # only returns true once the runner has re-written them fully.
                for name in ${BINARIES}; do rm -f "${SRC_DIR}/${name}"; done

                ./daytona-runner > /tmp/runner.log 2>&1 &
                RUNNER_PID=$!

                elapsed=0
                while [ ${elapsed} -lt ${EXTRACT_TIMEOUT_SEC} ]; do
                  all_present=1
                  for name in ${BINARIES}; do
                    [ -s "${SRC_DIR}/${name}" ] || { all_present=0; break; }
                  done
                  [ ${all_present} -eq 1 ] && break
                  sleep 1
                  elapsed=$((elapsed + 1))
                done

                kill -9 ${RUNNER_PID} 2>/dev/null || true
                wait ${RUNNER_PID} 2>/dev/null || true

                for name in ${BINARIES}; do
                  if [ ! -s "${SRC_DIR}/${name}" ]; then
                    echo "[daytona-binary-installer] ERROR: ${SRC_DIR}/${name} not produced within ${EXTRACT_TIMEOUT_SEC}s. runner log:"
                    tail -n 50 /tmp/runner.log || true
                    return 1
                  fi
                done
                return 0
              }

              cleanup_stale_dirs
              until extract_binaries; do
                echo "[daytona-binary-installer] extraction failed, retrying in 10s..."
                sleep 10
              done
              install_all

              # Keep host binaries in sync with whatever version is embedded in
              # the current runner image. On a runner image bump the daemonset
              # rolls, the new sidecar re-extracts, and the host files get
              # refreshed. Also self-heals if a file is removed on the host.
              while true; do
                sleep "${REFRESH_INTERVAL_SEC}"
                cleanup_stale_dirs
                for name in ${BINARIES}; do
                  SRC_SUM=$(sha256sum "${SRC_DIR}/${name}" 2>/dev/null | awk '{print $1}')
                  DST_SUM=$(sha256sum "${DST_DIR}/${name}" 2>/dev/null | awk '{print $1}')
                  if [ -z "${DST_SUM}" ] || [ "${SRC_SUM}" != "${DST_SUM}" ]; then
                    echo "[daytona-binary-installer] refreshing ${HOST_SRC_DIR}/${name}"
                    install_one "${name}" || echo "[daytona-binary-installer] WARN: refresh install failed for ${name}"
                  fi
                done
              done
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
