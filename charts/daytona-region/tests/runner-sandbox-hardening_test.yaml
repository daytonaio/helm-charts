suite: runner sandbox hardening (egress, dns, fractional cpu, volumes)
templates:
  - runner-daemonset.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  # Container order reference (with chart defaults dockerInstaller.enabled=true,
  # daemonInstaller.enabled=true): [0]=docker-installer, then any enabled
  # hardening sidecars (egress-enforcer before sandbox-cpu-reconciler), then
  # daytona-binary-installer, then the opt-in runner main container.
  - it: renders NO hardening containers by default (backward compat)
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
    asserts:
      - isKind:
          of: DaemonSet
      - notContains:
          path: spec.template.spec.containers
          content:
            name: egress-enforcer
          any: true
      - notContains:
          path: spec.template.spec.containers
          content:
            name: sandbox-cpu-reconciler
          any: true
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: buildkitd\.toml

  # NOTE: these prove the text is emitted, NOT that peer traffic is denied on a
  # node. The property is proven only by a live two-sandbox probe with captured
  # kernel state. Assertions target executable statements, never comments.
  - it: asserts sandbox peer denial by default
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
    asserts:
      # Single-sourced host script, so the two call sites cannot drift.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'cat > /usr/local/sbin/daytona-peer-denial\.sh'
      # Invoked at bootstrap AND from the monitor loop.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)Asserting sandbox peer-denial\.\.\..*?/usr/local/sbin/daytona-peer-denial\.sh'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)Re-assert sandbox peer denial.*?/usr/local/sbin/daytona-peer-denial\.sh'
      # The rule itself.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'iptables -w -I DOCKER-USER 1 -i docker0 -o docker0 -j DROP'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'ip6tables -w -I DOCKER-USER 1 -i docker0 -o docker0 -j DROP'
      # The kernel precondition, without which the rule filters nothing.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'modprobe br_netfilter'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'bridge-nf-call-iptables'
      # Boot-window coverage.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"icc": false'

  - it: does not bounce dockerd for the icc key alone
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
    asserts:
      # The restart decision compares daemon.json with the icc key filtered out, so
      # adding it never stops a running sandbox to apply a key that is inert there.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "grep -v '\"icc\"' /etc/docker/daemon.json > /tmp/daytona-dj-new"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'elif \[ "\$daemon_json_changed" = 1 \]'
      # Bounded xtables wait: the runner writes DOCKER-USER on every sandbox change.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'iptables -w 5 -I DOCKER-USER 1 -i docker0'

  - it: fails closed when peer denial cannot be established
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
    asserts:
      # Bootstrap and monitor loop both exit non-zero rather than warn and continue.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)FATAL: sandbox peer-denial could not be established.*?exit 3'
      # ...and that inner exit must reach the outer shell, not die inside nsenter.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)bootstrap_rc=\$\?.*?bootstrap_rc" = 3.*?exit 1'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)FATAL: sandbox peer-denial re-assert failed.*?exit 1'
      # IPv6 insertion failure counts toward the exit status, not a bare warning.
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)ERROR: failed to install IPv6 sandbox peer-denial rule[^\n]*\n\s*rc=1'

  - it: removes the peer-denial rule when sandboxIsolation is disabled
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.sandboxIsolation.enabled: false
    asserts:
      # No enforcement, and no orphaned rule left behind.
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'iptables -w -I DOCKER-USER 1 -i docker0 -o docker0 -j DROP'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"icc": false'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'iptables -w -D DOCKER-USER -i docker0 -o docker0 -j DROP'

  - it: networkPolicy.enabled renders the egress-enforcer with block + input rules
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.networkPolicy.enabled: true
      services.runner.dockerInstaller.dns:
        - "8.8.8.8"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: egress-enforcer
      - matchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "ipt -A SBX_EGRESS -d 10\\.0\\.0\\.0/8 -j DROP"
      - matchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "ipt -A SBX_EGRESS -d 169\\.254\\.0\\.0/16 -j DROP"
      - matchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "ipt -A SBX_EGRESS -d 8\\.8\\.8\\.8/32 -j RETURN"
      - matchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "ipt -A SBX_INPUT -p tcp --dport 22 -j DROP"
      - matchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "ipt -A SBX_INPUT -p tcp --dport 10250 -j DROP"

  - it: networkPolicy allowlist mode renders the terminal deny instead of per-CIDR drops
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.networkPolicy.enabled: true
      services.runner.networkPolicy.policyMode: allowlist
      services.runner.networkPolicy.allowCIDRs:
        - "203.0.113.0/24"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "ipt -A SBX_EGRESS -d 203\\.0\\.113\\.0/24 -j RETURN"
      - matchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "ipt -A SBX_EGRESS -j DROP"
      - notMatchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "ipt -A SBX_EGRESS -d 10\\.0\\.0\\.0/8 -j DROP"

  - it: buildkit.dns.nameservers writes buildkitd.toml on the host via the installer
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.buildkit.dns.nameservers:
        - "8.8.8.8"
        - "1.1.1.1"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "/etc/buildkit/buildkitd\\.toml"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'nameservers = \["8\.8\.8\.8","1\.1\.1\.1"\]'

  - it: sandboxResources.enabled renders the cpu reconciler with the configured scale
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.sandboxResources.enabled: true
      services.runner.sandboxResources.limitMillicoresPerVcpu: 500
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: sandbox-cpu-reconciler
      - matchRegex:
          path: spec.template.spec.containers[1].args[0]
          pattern: "LIMIT_MILLI=500"
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-docker-socket
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sandbox-cpu-state
          any: true

  - it: volumes.backend=rclone mounts /mnt Bidirectional + the mount-s3 shim on the main container
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.mainContainer.enabled: true
      services.runner.volumes.backend: rclone
    asserts:
      # containers: [0]=docker-installer, [1]=daytona-binary-installer, [2]=runner
      - equal:
          path: spec.template.spec.containers[2].name
          value: runner
      - contains:
          path: spec.template.spec.containers[2].volumeMounts
          content:
            name: volume-host-mnt
            mountPath: /mnt
            mountPropagation: Bidirectional
      - contains:
          path: spec.template.spec.containers[2].volumeMounts
          content:
            name: volume-mount-shim
            mountPath: /usr/local/bin/mount-s3
            subPath: mount-s3
      - contains:
          path: spec.template.spec.volumes
          content:
            name: volume-host-mnt
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: volume-mount-shim
          any: true

  - it: volumes.backend=s3 mounts /mnt but does NOT inject the shim
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.mainContainer.enabled: true
      services.runner.volumes.backend: s3
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: volume-host-mnt
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: volume-mount-shim
          any: true

  - it: rejects isolation enabled without the docker installer
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.sandboxIsolation.enabled: true
      services.runner.dockerInstaller.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "services.runner.sandboxIsolation.enabled=true requires services.runner.dockerInstaller.enabled=true (the peer-denial control is applied by the docker-installer). Set services.runner.sandboxIsolation.enabled=false to run without inter-sandbox isolation, and provide an equivalent host-level control yourself."

  - it: does not reject the config when no runner is deployed
    set:
      regionName: "test"
      proxyUrl: "https://p.example.com"
      daytonaApiUrl: "https://api.example.com/api"
      daytonaApiKey: "test"
      services.runner.enabled: false
      services.runner.sandboxIsolation.enabled: true
      services.runner.dockerInstaller.enabled: false
    asserts:
      - hasDocuments:
          count: 0
